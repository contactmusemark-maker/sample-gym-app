(async()=>{
 $('#spl').src=LOGO;document.head.insertAdjacentHTML('beforeend',`<link rel="icon" href="${LOGO}"><link rel="apple-touch-icon" href="${LOGO}">`);
 const g=$('#spg'),W=innerWidth,H=innerHeight,cols=Math.ceil(W/26),rows=Math.ceil(H/26),mx=Math.hypot(W/2,H/2);
 g.style.gridTemplateColumns=`repeat(${cols},1fr)`;g.style.gridTemplateRows=`repeat(${rows},1fr)`;
 let cells='';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)cells+=`<u style="--d:${(Math.hypot((x+.5)/cols*W-W/2,(y+.5)/rows*H-H/2)/mx*1.2).toFixed(2)}s"></u>`;g.innerHTML=cells;
 const done=()=>{$('#sp').style.opacity=0;setTimeout(()=>$('#sp').remove(),500)};
 if(CFG.url.startsWith('YOUR_')){done();return view('<div class="wrap"><div class="card k a"><h1>Connect Supabase</h1><p class="sm" style="margin-top:12px">Set CFG.url and CFG.key at the top of the script, then run supabase_setup.sql.</p></div></div>')}
 if(!window.supabase||!window.lucide){done();return app.innerHTML='<div style="padding:32px;font:16px sans-serif"><b>Could not load required scripts.</b><p>Check your internet connection and reload.</p></div>'}
 sb=supabase.createClient(CFG.url,CFG.key);S.c=new URLSearchParams(location.search).get('c');
 await Promise.all([start(),splashVideo()]);done();
})();
function splashVideo(){
 return new Promise(res=>{
  const sp=$('#sp');let fin=0;const end=()=>{if(!fin){fin=1;res()}},fb=()=>{sp.classList.add('fb');setTimeout(end,1500)};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return fb();
  try{
   const b=atob(VID),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
   const v=document.createElement('video');v.className='sv';v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';
   v.src=URL.createObjectURL(new Blob([u],{type:'video/mp4'}));
   v.onended=end;v.onerror=fb;$('#skip').onclick=end;sp.prepend(v);

function peak(){
 const f=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'numeric',hourCycle:'h23'}),c=Array(24).fill(0),s=addDays(ymd(new Date()),-span());
 S.att.forEach(x=>{if(x.day>=s&&x.status=='approved')c[+f.format(new Date(x.checked_in_at))]++});
 const mx=Math.max(...c),pk=c.indexOf(mx),h12=h=>(h%12||12)+(h<12?' AM':' PM');
 return `<div class="card w b" style="margin-top:10px"><span class="sm">Busiest hours</span>${mx?`<div class="n m" style="margin-top:6px">${h12(pk)} to ${h12((pk+1)%24)}</div>`:'<p style="margin-top:6px">No check-ins in this period.</p>'}<div class="bars" style="height:90px;gap:2px">${c.map((v,h)=>`<div><u style="height:${mx?v/mx*100:0}%;${h==pk&&mx?'':'opacity:.4'}"></u><span class="sm">${h%6==0?h:'&nbsp;'}</span></div>`).join('')}</div></div>`
}
function aDetail(){
 const m=S.mm[S.dm];if(!m){S.dm=null;return aMem()}
 const rows=S.att.filter(x=>x.member_id==m.id),{t,ok,st,best}=stats(rows),live=rows.filter(x=>x.status!='rejected'),map={};rows.forEach(x=>map[x.day]=x.status);
 const d=new Date(Date.UTC(+t.slice(0,4),+t.slice(5,7)-1+S.dc,1)),y=d.getUTCFullYear(),mo=d.getUTCMonth(),p=String(mo+1).padStart(2,'0'),dim=new Date(Date.UTC(y,mo+1,0)).getUTCDate();
 let c=['S','M','T','W','T','F','S'].map(x=>`<span class="h">${x}</span>`).join('')+'<span></span>'.repeat(d.getUTCDay());
 for(let i=1;i<=dim;i++){const k=`${y}-${p}-${String(i).padStart(2,'0')}`,q=map[k];c+=`<span class="${q=='approved'?'on':q=='pending'?'p':''} ${k==t?'t':''}">${i}</span>`}
 const sorted=live.slice().sort((a,b)=>b.checked_in_at.localeCompare(a.checked_in_at)),last=sorted[0];
 view(`<div class="wrap ad"><button class="btn g s" onclick="go('mem')"><i data-lucide="arrow-left"></i>Members</button>
 <div class="top" style="margin-top:14px">${av(m.avatar)}<div><h1 style="font-size:26px">${esc(m.name)}</h1><span class="sm">${m.mobile}${m.age?' · '+m.age+' yrs':''}${m.active?'':' · Inactive'}</span></div></div>
 <div class="grid"><div class="card k a ar"><span class="sm">Streak</span><span class="n" style="margin-top:6px">${st}</span><span class="sm">Best ${best}</span></div><div class="card o"><span>Check-ins</span><span class="n" style="margin-top:6px">${ok.size}</span></div><div class="card w c2"><span class="sm">Last visit</span><div style="font-size:18px;font-weight:600">${last?fd(last.day)+' at '+tm(last.checked_in_at):'No visits yet'}</div></div></div>
 <div class="card w b" style="margin-top:8px"><div class="top"><button class="ic" style="background:var(--g)" onclick="S.dc--;aRender()" aria-label="Previous month"><i data-lucide="chevron-left"></i></button><div style="text-align:center"><b style="font-size:18px">${d.toLocaleDateString('en-IN',{month:'long',year:'numeric',timeZone:'UTC'})}</b></div><button class="ic" style="background:var(--g)" onclick="S.dc++;aRender()" aria-label="Next month" ${S.dc>=0?'disabled style="opacity:.3"':''}><i data-lucide="chevron-right"></i></button></div><div class="cal">${c}</div></div>
 <h2>History</h2>${sorted.length?sorted.slice(0,30).map(x=>`<div class="row"><i data-lucide="calendar-check"></i><div><b>${fd(x.day)}</b><span class="sm">${tm(x.checked_in_at)}</span></div><span class="tag ${x.status=='approved'?'o':''}">${x.status=='approved'?'Present':'Pending'}</span></div>`).join(''):'<div class="empty"><p>No check-ins in the last 200 days.</p></div>'}</div>`)
}
async function decide(id,status){const{error}=await sb.from('attendance').update({status}).eq('id',id);if(error)return toast(error.message,'err');await loadAdmin();aRender();toast(status=='approved'?'Approved':'Rejected')}
function memList(){
 const q=(S.q||'').toLowerCase(),l=S.mem.filter(m=>m.name.toLowerCase().includes(q)||m.mobile.includes(q));
 return l.length?l.map(m=>`<div class="row" style="${m.active?'':'opacity:.5'}">${av(m.avatar)}<div onclick="openM('${m.id}')" style="cursor:pointer"><b>${esc(m.name)}</b><span class="sm">${m.mobile}${m.age?' · '+m.age+' yrs':''}${m.user_id?'':' · invited'}</span></div><button class="ic" aria-label="Edit" onclick="sheet('${m.id}')"><i data-lucide="pencil"></i></button><button class="ic" aria-label="${m.active?'Deactivate':'Activate'}" onclick="toggle('${m.id}')"><i data-lucide="${m.active?'user-x':'user-check'}"></i></button></div>`).join(''):'<div class="empty"><p>No members match.</p></div>'
}
function aMem(){view(`<div class="wrap ad"><div class="top"><h1 style="flex:1">Members</h1><button class="btn o s" onclick="sheet()"><i data-lucide="plus"></i>Add</button></div><input placeholder="Search name or mobile" value="${esc(S.q)}" oninput="S.q=this.value;$('#list').innerHTML=memList();lucide.createIcons()"><div id="list">${memList()}</div></div>`)}
function sheet(id){
 const m=S.mm[id]||{};document.body.insertAdjacentHTML('beforeend',`<div class="sheet" onclick="if(event.target==this)this.remove()"><div><h2 style="margin-top:0">${id?'Edit member':'Add member'}</h2><input id="sn" placeholder="Full name" value="${esc(m.name)}" maxlength="80"><input id="sa" placeholder="Age" inputmode="numeric" value="${m.age||''}"><input id="sm" placeholder="Mobile (10 digits)" inputmode="numeric" maxlength="10" value="${m.mobile||''}" ${m.user_id?'disabled':''}><button class="btn o f" onclick="saveM('${id||''}',this)">Save member</button></div></div>`)
}
async function saveM(id,b){
 const name=val('sn'),age=+val('sa')||null,mobile=val('sm');if(!name||!/^\d{10}$/.test(mobile))return toast('Enter a name and a 10-digit mobile','err');
 b.disabled=true;const row={name,age,mobile},r=id?await sb.from('members').update(row).eq('id',id):await sb.from('members').insert(row);
 if(r.error){b.disabled=false;return toast(/duplicate/.test(r.error.message)?'That mobile is already a member':r.error.message,'err')}
 document.querySelector('.sheet').remove();await loadAdmin();aRender();toast('Member saved')
}
async function toggle(id){const m=S.mm[id],{error}=await sb.from('members').update({active:!m.active}).eq('id',id);if(error)return toast(error.message,'err');await loadAdmin();aRender();toast(m.active?'Member deactivated':'Member activated')}
function series(){
 const t=ymd(new Date()),c={};S.att.forEach(x=>x.status=='approved'&&(c[x.day]=(c[x.day]||0)+1));const o=[];
 if(S.sm=='d')for(let i=13;i>=0;i--){const d=addDays(t,-i);o.push({l:d.slice(8),v:c[d]||0})}
 else if(S.sm=='w')for(let w=11;w>=0;w--){let v=0;for(let i=0;i<7;i++)v+=c[addDays(t,-w*7-i)]||0;o.push({l:'W'+(12-w),v})}
 else for(let k=5;k>=0;k--){const d=new Date(Date.UTC(+t.slice(0,4),+t.slice(5,7)-1-k,1)).toISOString().slice(0,7);let v=0;for(const x in c)if(x.startsWith(d))v+=c[x];o.push({l:d.slice(5),v})}
 return o
}
const span=()=>({d:14,w:84,m:180}[S.sm]);
function hist(){const s=addDays(ymd(new Date()),-span());return S.att.filter(x=>x.day>=s).map(x=>{const m=S.mm[x.member_id]||{};return[x.day,m.name||'',m.mobile||'',tm(x.checked_in_at),x.status]})}
function aRep(){
 const s=series(),mx=Math.max(1,...s.map(x=>x.v)),h=hist();
 view(`<div class="wrap ad"><h1>Reports</h1>${seg([['d','Daily'],['w','Weekly'],['m','Monthly']],S.sm,'setSm')}
 <div class="card k a"><span class="sm">Check-ins per ${{d:'day',w:'week',m:'month'}[S.sm]}</span><div class="bars">${s.map(x=>`<div>${x.v||''}<u style="height:${x.v/mx*80}%"></u><span class="sm">${x.l}</span></div>`).join('')}</div></div>
 ${peak()}
 <div style="display:flex;gap:8px;margin:12px 0"><button class="btn g f" onclick="csv()"><i data-lucide="file-spreadsheet"></i>CSV</button><button class="btn o f" onclick="pdf()"><i data-lucide="file-text"></i>PDF</button></div>
 <h2>History</h2>${h.length?h.slice(0,150).map(r=>`<div class="row"><div><b>${esc(r[1])}</b><span class="sm">${r[0]} · ${r[3]}</span></div><span class="tag ${r[4]=='approved'?'o':''}">${r[4]}</span></div>`).join(''):'<div class="empty"><p>No attendance in this period.</p></div>'}</div>`)
}
const setSm=k=>{S.sm=k;aRender()};
function csv(){
 const h=hist();if(!h.length)return toast('Nothing to export','err');
 const f=v=>`"${(/^[=+\-@]/.test(v)?"'"+v:v).replace(/"/g,'""')}"`;
 const txt=[['Date','Name','Mobile','Time','Status'],...h].map(r=>r.map(f).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=`attendance-${ymd(new Date())}.csv`;a.click();toast('CSV downloaded')
}
function pdf(){
 const h=hist();if(!h.length)return toast('Nothing to export','err');
 $('#print').innerHTML=`<h2>Attendance report · ${ymd(new Date())}</h2><table><tr><th>Date</th><th>Name</th><th>Mobile</th><th>Time</th><th>Status</th></tr>${h.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;print()
}
function aQr(){
 view(`<div class="wrap ad"><h1>Gym QR</h1>${seg([['open','Open'],['rotating','Rotating'],['approval','Approval']],S.mode,'setMode')}
 <p class="sm">${{open:'Anyone with the QR can mark attendance. Easiest, but a photo of the poster can be shared.',rotating:'The QR changes every minute. Show this screen at the desk so only people inside can check in.',approval:'Members check in, then you approve each one on the Today screen. Strongest proof of presence.'}[S.mode]}</p>
 <div class="card k a" style="margin-top:12px;text-align:center"><div id="qr"></div><b id="cd" class="n m" style="letter-spacing:.05em"></b></div>
 ${(()=>{const q=S.gs||{};return `<div class="card w" style="margin-top:12px"><div class="top" style="margin:0 0 8px"><div><b>Location check</b><div class="sm">${q.lat!=null?`Gym set at ${q.lat.toFixed(4)}, ${q.lng.toFixed(4)}`:'Gym location not set'}</div></div><button class="btn s ${q.geo_required?'o':'g'}" onclick="setGeo(${!q.geo_required})">${q.geo_required?'On':'Off'}</button></div><button class="btn g f s" onclick="saveLoc(this)"><i data-lucide="map-pin"></i>Set gym location to where I am</button>${seg([[50,'50 m'],[100,'100 m'],[200,'200 m']],q.radius_m||100,'setRad')}<p class="sm">Members must be within this distance to mark attendance. Stand inside the gym when you set it.</p></div>`})()}
 <button class="btn o f" style="margin-top:12px" onclick="poster()"><i data-lucide="printer"></i>Print poster</button></div>`);
 S.qt=setInterval(()=>S.tab=='qr'&&drawQr(),20000)
}
async function upd(o,msg){const{error}=await sb.from('gym_settings').update(o).eq('id',1);if(error)return toast(error.message,'err');Object.assign(S.gs,o);clearInterval(S.qt);aRender();toast(msg)}
function setGeo(on){if(on&&S.gs.lat==null)return toast('Set the gym location first','err');upd({geo_required:on},on?'Location check on':'Location check off')}
const setRad=r=>upd({radius_m:+r},'Radius updated');
function saveLoc(b){b.disabled=true;navigator.geolocation.getCurrentPosition(p=>upd({lat:p.coords.latitude,lng:p.coords.longitude},'Gym location saved'),()=>{b.disabled=false;toast('Allow location access, then try again','err')},{enableHighAccuracy:true,timeout:15000})}
async function setMode(m){const{error}=await sb.from('gym_settings').update({mode:m}).eq('id',1);if(error)return toast(error.message,'err');S.mode=m;clearInterval(S.qt);aRender();toast('Mode updated')}
async function drawQr(){
 const el=$('#qr');if(!el)return;let u=location.origin+location.pathname;
 if(S.mode=='rotating'){const r=await sb.rpc('rotating_code');if(r.error)return toast(r.error.message,'err');u+='?c='+r.data;$('#cd').textContent=r.data}else $('#cd').textContent='';
 el.innerHTML='';new QRCode(el,{text:u,width:220,height:220,colorDark:'#101010',colorLight:'#F7F7F5'})
}
function poster(){
 $('#print').innerHTML='<div class="q"><img src="'+LOGO+'" style="width:240px"><h1>Scan to check in</h1><div id="pq"></div><p>Open your camera, scan, and tap Mark Attendance.</p></div>';
 new QRCode($('#pq'),{text:location.origin+location.pathname,width:420,height:420});setTimeout(print,400)
}

/* ---------- pull to refresh + pixel burst ---------- */
async function refresh(){if(!S.role||S.busy)return;S.busy=1;try{S.role=='a'?(await loadAdmin(),aRender()):(await loadMember(),mRender());toast('Updated')}catch(e){toast(e.message,'err')}S.busy=0}
let ty=-1,pl=0;const ptr=document.body.appendChild(Object.assign(document.createElement('div'),{id:'ptr',innerHTML:'<div class="spin"></div>'}));
addEventListener('touchstart',e=>{ty=scrollY<=0&&S.role&&!document.querySelector('.sheet')?e.touches[0].clientY:-1;pl=0},{passive:true});
addEventListener('touchmove',e=>{if(ty<0)return;pl=e.touches[0].clientY-ty;if(pl>0){ptr.style.opacity=Math.min(pl/90,1);ptr.style.transform=`translateY(${Math.min(pl,90)/2}px) rotate(${pl*3}deg)`}},{passive:true});
addEventListener('touchend',()=>{ptr.style.opacity=0;ptr.style.transform='';if(ty>=0&&pl>90)refresh();ty=-1},{passive:true});
function burst(x,y){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<40;i++){const u=document.createElement('u'),a=Math.random()*6.28,d=60+Math.random()*130;u.className='px';u.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;${i%4==0?'background:#101010':''}`;document.body.append(u);setTimeout(()=>u.remove(),1000)}}
</script></body></html>
